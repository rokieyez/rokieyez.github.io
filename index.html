<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로키즈미디어 — GET VISUALIZED</title>
<meta name="description" content="로키즈미디어 — 기획부터 촬영, 편집, 모션그래픽까지. 영상제작 스튜디오.">
<link rel="canonical" href="https://www.rokiz.net/">
<meta property="og:url" content="https://www.rokiz.net/">
<meta property="og:title" content="로키즈미디어 — GET VISUALIZED">
<meta property="og:description" content="기획부터 촬영, 편집, 모션그래픽까지. 영상제작 스튜디오.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.rokiz.net/og-media.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins/800-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --text:#1d1d1f; --text2:rgba(60,60,67,.72); --sep:rgba(60,60,67,.16);
  --win:rgba(246,246,248,.82); --field:rgba(255,255,255,.85); --fill:rgba(120,120,128,.14); --fill2:rgba(120,120,128,.24);
  --bar:rgba(255,255,255,.36); --dock:rgba(255,255,255,.3); --edge:rgba(255,255,255,.55); --menu:#111;
  --brand:#f7ce0a; --accent:#f7ce0a; --on-accent:#111; --shadow:0 0 0 .5px rgba(0,0,0,.22),0 24px 60px rgba(0,0,0,.32),0 4px 12px rgba(0,0,0,.12);
  --base:#c9b8ff; --line:rgba(255,255,255,.9);
  /* 바탕화면: 직접 만든 색 번짐 */
  --wall:
    radial-gradient(90% 70% at 100% 100%,#ff9fb8 0,transparent 60%),
    radial-gradient(80% 70% at 70% 10%,#9db8ff 0,transparent 60%),
    radial-gradient(70% 60% at 0% 80%,#ffc89a 0,transparent 60%),
    linear-gradient(160deg,#b9a5ff,#e0b3f0 55%,#ffc2a8);
}
:root[data-theme="dark"]{
  --text:#f5f5f7; --text2:rgba(235,235,245,.62); --sep:rgba(255,255,255,.1);
  --win:rgba(30,30,36,.8); --field:rgba(255,255,255,.07); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.4);
  --bar:rgba(16,16,18,.45); --dock:rgba(44,44,48,.45); --edge:rgba(255,255,255,.16); --menu:#fff;
  --accent:#f7ce0a; --shadow:0 0 0 .5px rgba(255,255,255,.16),0 30px 70px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.3);
  --base:#0b0a1f; --line:rgba(190,185,255,.75);
  --wall:
    radial-gradient(70% 70% at 62% 22%,#3a2f78 0,transparent 62%),
    radial-gradient(60% 60% at 0% 70%,#1d1a4d 0,transparent 60%),
    radial-gradient(60% 50% at 100% 100%,#3a1840 0,transparent 60%),
    linear-gradient(180deg,#16133a,#0b0a1f);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.6;color:var(--text);background:var(--base);overflow:hidden;-webkit-font-smoothing:antialiased;
}
#wall{position:fixed;inset:0;z-index:-1;background:var(--wall)}
#wall svg{position:absolute;inset:0;width:100%;height:100%}
#wall path{fill:none;stroke:var(--line);vector-effect:non-scaling-stroke}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* 모바일 크롬이 누를 때 씌우는 파란 상자를 끈다. 글자판으로 옮겨 다닐 때의 테두리(:focus-visible)는 남긴다 */
*{-webkit-tap-highlight-color:transparent}
:focus:not(:focus-visible){outline:none}
a{color:inherit}
svg{display:block}

/* ── 메뉴 막대 ── */
#menubar{
  position:fixed;inset:0 0 auto 0;height:30px;z-index:9000;display:flex;align-items:center;gap:2px;padding:0 10px;
  background:var(--bar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  font-size:13.5px;color:var(--menu);box-shadow:0 .5px 0 var(--edge);
}
#menubar .brand{font-weight:700;padding:0 10px 0 4px;display:flex;align-items:center;gap:8px;line-height:1}
/* 로고: 검은 앱 아이콘 판 위에 노란 필름 카메라 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.logo{display:inline-grid;place-items:center;border-radius:24%;background:#000;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28)}
.logo svg{width:72%;height:auto;fill:var(--brand)}
#menubar .logo{width:25px;background:none;box-shadow:none;border-radius:0}
#menubar .logo svg{width:100%}
.wordmark{font-family:Poppins,"Pretendard Variable",sans-serif;font-weight:800;font-style:italic;letter-spacing:-.5px;color:#e8f5f3;line-height:1}
.slogan{font-family:Poppins,sans-serif;font-weight:500;letter-spacing:.62em;margin-right:-.62em;color:#e8f5f3;font-size:10px}
:root:not([data-theme="dark"]) .win :is(.wordmark,.slogan){color:var(--text)}
.app .lg{width:36px;height:auto;fill:var(--brand)}
#spotList .app .lg{width:20px}
/* 글자 줄 높이가 단추보다 커서 글자가 1.5px 아래로 밀렸었다 — 줄 높이를 1 로 두고 가운데에 놓는다 */
#menubar button{display:inline-flex;align-items:center;padding:0 9px;border-radius:5px;height:22px;font-weight:500;line-height:1}
#menubar button:hover{background:rgba(255,255,255,.22)}
#menubar .spacer{flex:1}
#themeBtn svg,#spotBtn svg{width:15px;height:15px;fill:currentColor}
#clock{padding:0 6px;font-weight:500;font-variant-numeric:tabular-nums}

/* ── 바탕화면 · 오른쪽 아이콘 ── */
#desktop{position:fixed;inset:30px 0 0 0}
.app{display:grid;place-items:center;width:54px;height:54px;border-radius:13px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.28)}
.app svg{width:28px;height:28px;fill:#fff}
#deskicons{position:absolute;right:14px;top:14px;display:grid;gap:10px;transition:transform .45s cubic-bezier(.2,.9,.3,1)}
body:has(#toast.on) #deskicons{transform:translateY(92px)}
#deskicons button{display:grid;justify-items:center;gap:5px;width:88px;padding:8px 0 5px;border-radius:8px;color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#deskicons button:hover{background:rgba(255,255,255,.14)}

/* ── 창 ── */
.win{
  position:absolute;display:none;flex-direction:column;min-width:260px;border-radius:12px;overflow:hidden;
  background:var(--win);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  box-shadow:var(--shadow);
}
.win.open{display:flex;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.win.max{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 30px - 100px)}
.win.max .body{max-height:none;flex:1}
.win .bar{
  height:40px;flex:none;display:flex;align-items:center;padding:0 14px;position:relative;
  border-bottom:.5px solid var(--sep);cursor:default;user-select:none;touch-action:none;
}
.lights{display:flex;gap:8px;z-index:1}
.lights button{width:12px;height:12px;border-radius:50%;background:var(--fill2);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12);display:grid;place-items:center;font-size:9px;line-height:1;color:transparent;font-weight:700}
.win.active .lights .c,.lights:hover .c{background:#ff5f57}
.win.active .lights .m,.lights:hover .m{background:#febc2e}
.win.active .lights .z,.lights:hover .z{background:#28c840}
.lights:hover button{color:rgba(0,0,0,.55)}
.win .bar .t{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--text2);pointer-events:none}
.win.active .bar .t{color:var(--text)}
.win .body{padding:18px 20px 20px;overflow:auto;max-height:70vh}
.win h2{font-size:20px;line-height:1.3;letter-spacing:-.3px;margin-bottom:8px}
.win p{color:var(--text2)}
.win p+p{margin-top:10px}
.tag{display:inline-block;padding:2px 10px;margin:2px 4px 0 0;border-radius:99px;background:var(--fill);font-size:12px;color:var(--text)}

/* ── 플레이어 ── */
#w-player{width:min(640px,92vw)}
#w-player .body{padding:0;max-height:none}
.tv{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.tv>*{position:absolute;inset:0;width:100%;height:100%;border:0}
#poster{object-fit:cover;display:none}
#embed{display:none;background:#000}
#embed iframe,#embed video{position:absolute;top:0;height:100%;border:0;left:50%;transform:translateX(-50%);width:100%}
#embed.vertical iframe{width:auto;aspect-ratio:9/16}
#bigPlay{display:none;place-items:center;background:rgba(0,0,0,.18)}
#bigPlay i{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5);transition:transform .15s}
#bigPlay:hover i{transform:scale(1.08)}
#bigPlay svg{width:26px;height:26px;fill:#fff;margin-left:4px}
.tv.poster #poster{display:block}.tv.poster #bigPlay{display:grid}
.tv.embed #embed{display:block}
.tv.fade::after{content:"";position:absolute;inset:0;background:#000;animation:fade .35s ease-out forwards;pointer-events:none}
@keyframes fade{to{opacity:0}}
.ctrl{display:flex;gap:4px;padding:10px 14px;align-items:center}
.ctrl .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.ctrl .ic:hover{background:var(--fill)}
.ctrl .ic svg{width:18px;height:18px;fill:currentColor}
.now{flex:1;min-width:0;padding:0 10px}
.now b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{display:block;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;text-align:center}
.pill:hover{filter:brightness(1.08)}
.pill:active{filter:brightness(.92)}

/* ── 작업물 ── */
#w-works{width:min(720px,92vw)}
.finder{display:grid;grid-template-columns:150px 1fr;min-height:320px}
#w-works .body{padding:0}
.filters{padding:10px 8px;background:var(--fill);border-right:.5px solid var(--sep);display:flex;flex-direction:column;gap:1px}
.filters h3{font-size:11px;font-weight:600;color:var(--text2);padding:2px 8px 4px}
.filters button{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:13px;text-align:left}
.filters button i{width:9px;height:9px;border-radius:50%;flex:none}
.filters button.on{background:var(--fill2)}
.filters button small{margin-left:auto;color:var(--text2);font-size:11px}
.works{padding:16px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;align-items:start}
.work{align-self:start}
.work{text-align:left;display:block;width:100%}
.work[hidden]{display:none}
.work canvas,.work img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;box-shadow:0 0 0 .5px var(--sep),0 4px 12px rgba(0,0,0,.18);transition:transform .15s}
.work:hover canvas,.work:hover img{transform:scale(1.03)}
.work span{display:block;padding:8px 2px 0;font-size:13px;font-weight:600;line-height:1.4}
.work span>b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.work span small{display:block;font-weight:400;color:var(--text2);font-size:12px}

/* ── 제작 과정 (설정 앱 같은 묶음 목록) ── */
#w-process{width:min(440px,92vw)}
.group{list-style:none;background:var(--field);border-radius:10px;box-shadow:0 0 0 .5px var(--sep)}
.group li{display:flex;gap:12px;padding:11px 14px;align-items:flex-start}
.group li+li{border-top:.5px solid var(--sep)}
.group .no{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;font-style:normal}
.group b{display:block;font-size:14px}
.group span{color:var(--text2);font-size:13px}

/* ── 소개 · 문의 ── */
#w-about{width:min(340px,92vw)}
#w-about .body{text-align:center;padding:26px 26px 22px}
#w-about .logo{width:84px;height:84px;margin-bottom:16px;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.28)}
#w-about .wordmark{font-size:26px;margin-bottom:8px}
#w-about .slogan{display:block;margin-bottom:6px}
#w-about h2{margin-bottom:0}
#w-about .sub{font-size:12px;margin-bottom:14px}
#w-about .acts{display:flex;gap:8px;justify-content:center;margin-top:18px}
.ghost{border-radius:8px;padding:6px 14px;background:var(--fill);font-weight:500;font-size:13px}
.ghost:hover{background:var(--fill2)}
#w-contact{width:min(400px,92vw)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 4px;font-size:13px}
.rows dt{color:var(--text2)}
.rows a{text-decoration:none}
.rows a:hover{text-decoration:underline}
.brief{display:grid;gap:10px;margin-top:14px}
.brief label{display:grid;gap:3px;font-size:12px;color:var(--text2)}
.brief input,.brief select,.brief textarea{
  font:inherit;font-size:14px;color:var(--text);background:var(--field);border:0;border-radius:6px;padding:6px 9px;width:100%;
  box-shadow:0 0 0 .5px var(--sep),0 1px 1.5px rgba(0,0,0,.08);outline:0;color-scheme:light;
}
:root[data-theme="dark"] .brief :is(input,select,textarea){color-scheme:dark}
.brief :is(input,select,textarea):focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 50%,transparent)}
.brief textarea{min-height:76px;resize:vertical}
.brief .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.sendmsg{font-size:13px;min-height:1.6em;margin-top:-2px}
.sendmsg.ok{color:#30d158}.sendmsg.err{color:#ff6961}
:root:not([data-theme="dark"]) .sendmsg.ok{color:#1f8a3b}
:root:not([data-theme="dark"]) .sendmsg.err{color:#c4281c}
.pill:disabled{opacity:.6;cursor:default}
.btnrow button:not(.pill){border-radius:8px;padding:6px 14px;background:var(--fill);font-weight:500;font-size:13px}
.btnrow button:hover{background:var(--fill2)}

/* ── 배경 고르기 (밝게·어둡게와 따로) ── */
/* 고를 수 있는 배경은 넷 다 어둡다. 밝게(테마)는 창 안쪽만 바꾸고, 바탕 위에 얹히는 메뉴 막대·위젯·독은 늘 어두운 유리 + 흰 글자다
   (이게 없어서 밝은 테마에서 검은 배경 위 검은 글자가 됐었다) */
:root[data-wall]{--menu:#fff;--bar:rgba(16,16,18,.45);--dock:rgba(44,44,48,.45);--edge:rgba(255,255,255,.16)}
[data-wall="rokiz"]:root{--base:#050505;--line:rgba(247,206,10,.6);--wall:
  radial-gradient(60% 55% at 68% 18%,rgba(247,206,10,.2) 0,transparent 62%),radial-gradient(55% 55% at 0% 85%,rgba(247,206,10,.09) 0,transparent 60%),
  radial-gradient(60% 50% at 100% 100%,#1c1a12 0,transparent 60%),linear-gradient(180deg,#121212,#050505)}
:root[data-wall="indigo"]{--bar:rgba(30,24,70,.4);--dock:rgba(40,38,70,.42)}
:root[data-wall="dusk"]{--base:#1a0b1e;--line:rgba(255,210,180,.7);--wall:
  radial-gradient(80% 70% at 75% 15%,#b0413e 0,transparent 60%),radial-gradient(70% 60% at 0% 90%,#3b1a5c 0,transparent 60%),
  radial-gradient(60% 50% at 100% 100%,#e0884a 0,transparent 60%),linear-gradient(180deg,#3a1440,#1a0b1e)}
:root[data-wall="graphite"]{--base:#0e0f12;--line:rgba(220,225,235,.55);--wall:
  radial-gradient(70% 70% at 60% 20%,#3a3f4a 0,transparent 62%),radial-gradient(60% 60% at 0% 80%,#1f232b 0,transparent 60%),linear-gradient(180deg,#1b1d22,#0e0f12)}

/* ── 위젯 ── */
#widgets{position:absolute;left:16px;top:16px;display:grid;grid-template-columns:repeat(2,158px);gap:14px}
.widget{height:158px;border-radius:22px;overflow:hidden;position:relative;text-align:left;color:#fff;
  background:var(--dock);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--edge),0 10px 30px rgba(0,0,0,.25)}
#wClock{padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--menu)}
#wClock .d{font-size:13px;font-weight:700;color:#ff453a}
#wClock .day{font-size:40px;font-weight:300;line-height:1;letter-spacing:-1px}
#wClock .time{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#wClock small{font-size:12px;opacity:.65}
#wLatest canvas,#wLatest img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#wLatest img{transform:scale(1.35)}  /* 유튜브 썸네일 위아래 검은 띠를 잘라 낸다 */
#wLatest .cap{position:absolute;inset:auto 0 0 0;padding:44px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.8) 45%,rgba(0,0,0,.92));font-size:13px;font-weight:600;line-height:1.3}
#wLatest .cap b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
#wLatest .cap small{display:block;font-weight:500;font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
#wLatest:hover{filter:brightness(1.08)}

/* ── 스포트라이트 ── */
#spot{position:fixed;inset:0;z-index:9500;display:none;justify-content:center;align-items:flex-start;padding:18vh 16px 0;background:rgba(0,0,0,.12)}
#spot.on{display:flex}
#spot .box{width:min(620px,100%);border-radius:16px;overflow:hidden;background:var(--win);backdrop-filter:blur(50px) saturate(180%);-webkit-backdrop-filter:blur(50px) saturate(180%);box-shadow:var(--shadow);animation:pop .15s ease-out}
#spot .q{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px}
#spot .q svg{width:22px;height:22px;fill:var(--text2);flex:none}
#spot input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:300;color:var(--text);background:none;border:0;outline:0}
#spot input::placeholder{color:var(--text2)}
#spotList{list-style:none;border-top:.5px solid var(--sep);padding:6px;max-height:46vh;overflow:auto}
#spotList:empty{display:none}
#spotList li{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
#spotList li.sel{background:var(--accent);color:var(--on-accent)}
#spotList li.sel small{color:rgba(0,0,0,.6)}
#spotList .app{width:30px;height:30px;border-radius:7px;flex:none}
#spotList .app svg{width:16px;height:16px}
#spotList img,#spotList canvas{width:48px;height:27px;border-radius:4px;object-fit:cover;flex:none}
#spotList b{font-weight:500}
#spotList small{margin-left:auto;color:var(--text2);font-size:12px;white-space:nowrap}

/* ── 오른쪽 누름 메뉴 ── */
#ctx{position:fixed;z-index:9400;display:none;min-width:200px;padding:5px;border-radius:9px;font-size:13.5px;background:var(--win);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--shadow)}
#ctx.on{display:block}
#ctx button{display:block;width:100%;text-align:left;padding:3px 10px;border-radius:5px}
#ctx button:hover{background:var(--accent);color:var(--on-accent)}
#ctx hr{border:0;border-top:.5px solid var(--sep);margin:5px 8px}

/* ── 알림 ── */
#toast{position:fixed;top:40px;right:12px;z-index:9300;width:min(340px,calc(100vw - 24px));display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;text-align:left;
  background:var(--win);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--shadow);
  transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.2,.9,.3,1)}
#toast.on{transform:none}
#toast .logo{width:38px;height:38px;flex:none}
#toast b{display:block;font-size:13px}
#toast span{display:block;font-size:13px;color:var(--text2);line-height:1.35}
#toast .x{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--win);box-shadow:var(--shadow);font-size:12px;line-height:1;opacity:0}
#toast:hover .x{opacity:1}

/* ── 독 ── */
#dock{
  position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:8999;display:flex;align-items:flex-end;gap:8px;padding:7px 9px 5px;
  border-radius:24px;background:var(--dock);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--edge),0 10px 30px rgba(0,0,0,.3);
}
#dock .item{position:relative;display:grid;justify-items:center;gap:3px;text-decoration:none}
#dock .item::after{content:"";width:4px;height:4px;border-radius:50%;background:transparent}
#dock .item.live::after{background:var(--menu);opacity:.75}
#dock .sep{width:1px;height:46px;background:var(--edge);margin:0 2px 12px}
#dock .ext .app::after{content:"↗";position:absolute;top:-3px;right:-3px;width:17px;height:17px;border-radius:50%;background:#1c1c1e;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
/* 올리면 아이콘 자체가 커져서 옆 아이콘을 밀어낸다 — transform 으로 키우면 자리는 그대로라 옆을 덮는다 */
#dock .app{position:relative;transition:width .15s ease-out,height .15s ease-out,border-radius .15s ease-out}
#dock .app svg{width:52%;height:52%;transition:none}
#dock .app .lg{width:66%;height:auto}
#dock .tip{
  position:absolute;bottom:calc(100% + 10px);padding:3px 10px;border-radius:6px;font-size:12px;white-space:nowrap;color:var(--text);
  background:var(--win);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);opacity:0;pointer-events:none
}
@media (hover:hover){
  #dock .item:hover .app{width:70px;height:70px;border-radius:17px}
  #dock .item:has(+.item:hover) .app,#dock .item:hover+.item .app{width:61px;height:61px;border-radius:15px}
  #dock .item:hover .tip{opacity:1}
}

/* ── 켜지는 화면 ── */
#boot{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .4s}
#boot.off{display:none}
#boot.bye{opacity:0}
#boot>div{text-align:center}
#boot .logo{display:grid;width:150px;background:none;box-shadow:none;margin:0 auto 14px}
#boot .logo svg{width:100%}
#boot .wordmark{font-size:38px;margin-bottom:10px}
#boot .slogan{display:block;font-size:11px;margin-bottom:34px}
#boot .pbar{margin:0 auto}
#boot .pbar{width:200px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
#boot .pbar i{display:block;height:100%;width:0;background:var(--brand);border-radius:9px;transition:width 1.1s cubic-bezier(.3,.1,.2,1)}

/* ── 좁은 화면: 창을 세로로 쌓는다 ── */
@media (max-width:760px){
  body{overflow:auto}
  #desktop{position:static;padding:44px 12px 104px;display:flex;flex-direction:column;gap:16px}
  #deskicons{display:none}
  #widgets{position:static;grid-template-columns:1fr 1fr}
  .finder{grid-template-columns:1fr}
  .filters{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:.5px solid var(--sep)}
  .filters h3{display:none}
  .filters button{white-space:nowrap}
  .win{position:static!important;width:100%!important;height:auto!important}
  .win .body{max-height:none}
  .lights .z{display:none}
  #menubar button:not(.keep){display:none}
  #dock{gap:5px;padding:6px 7px 4px;border-radius:20px}
  #dock .app{width:44px;height:44px;border-radius:11px}
  #dock .sep{height:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// ── 색 화면 (영상이 없을 때 대신 나오는 움직이는 그라데이션) ──
const SCENES = {
  sunset: ['#2b1b4a', '#ff5f8f', '#ffb36b', '#c86dd7'],
  night:  ['#070b24', '#1d3f8f', '#5e5ce6', '#0a84ff'],
  mint:   ['#0e3b43', '#30b0c7', '#63e6be', '#e2f7e1'],
  noon:   ['#2456a8', '#5ac8fa', '#ffd60a', '#ff9f0a'],

function drawScene(c, name, t, W = 320, H = 180){
  const p = SCENES[name] || SCENES.sunset;

  c.globalCompositeOperation = 'screen';
  for (let i = 1; i < 4; i++) {
    const x = W * (.5 + .38 * Math.sin(t * .23 * i + i * 2)), y = H * (.5 + .4 * Math.cos(t * .19 * i + i)), r = H * (.75 + .15 * Math.sin(t * .3 + i));
    const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, p[i]); g.addColorStop(1, 'transparent');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  c.globalCompositeOperation = 'source-over';
}

// 유튜브 주소에서 영상 ID(11자)를 뽑는다. 아니면 null.
function parseYT(url){
  const m = /(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/.exec(url || '');
  return m ? {id: m[1], vertical: /\/shorts\//.test(url)} : null;
}

const PLAY = SVG('M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z'), PAUSE = SVG('M6 4h4.500v16H6zM13.500 4H18v16h-4.500z');

// 큰 화면용 썸네일: 고화질(maxres)이 없는 영상은 120px 짜리 빈 그림이 오므로 그때는 hqdefault 로 물러난다
function bigPoster(id){
  const im = $('#poster');
  im.onload = () => { if (im.naturalWidth <= 120) { im.onload = null; im.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; } };
  im.src = `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
}
const tv = $('#tv'), sctx = $('#screen').getContext('2d'), embed = $('#embed');
let ch = 0, playing = true, clockT = 0, last = performance.now();
function showMedia(){
  // 지금 영상을 playing 상태에 맞게 화면에 올린다
  const w = CONFIG.works[ch], kind = kindOf(w);
  embed.innerHTML = ''; embed.className = ''; tv.classList.remove('poster', 'embed');
  $('#bPlay').innerHTML = playing ? PAUSE : PLAY;
  if (kind === 'demo') return;
  if (!playing) { kind === 'yt' ? bigPoster(parseYT(w.src).id) : $('#poster').removeAttribute('src'); tv.classList.add('poster'); return; }
  if (kind === 'yt') {
    const y = parseYT(w.src);
    embed.classList.toggle('vertical', y.vertical);
    embed.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${y.id}?autoplay=1&rel=0&playsinline=1" title="${w.title.replace(/"/g, '&quot;')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  } else {
    const v = document.createElement('video'); v.src = w.src; v.controls = true; v.playsInline = true; v.autoplay = true;
    embed.append(v);
  }
  tv.classList.add('embed');
}
function tune(i, autoplay){
  ch = (i + CONFIG.works.length) % CONFIG.works.length;
  const w = CONFIG.works[ch];
  $('#nowTitle').textContent = w.title; $('#nowMeta').textContent = w.cat || ''; $('#nowCh').textContent = `${ch + 1}/${CONFIG.works.length}`;
  // 실제 영상은 눌러야 틀고(소리 때문에), 색 화면은 바로 움직인다
  playing = kindOf(w) === 'demo' ? true : !!autoplay;
  if (typeof showNext === 'function' && $('#wLatest')) showNext();
  tv.classList.remove('fade'); void tv.offsetWidth; tv.classList.add('fade');
  showMedia();
}
function setPlaying(v){ playing = v; showMedia(); }
$('#bPrev').onclick = () => tune(ch - 1, false);
$('#bNext').onclick = () => tune(ch + 1, false);
$('#bPlay').onclick = () => setPlaying(!playing);
$('#bigPlay').onclick = () => setPlaying(true);
function frame(now){
  const demo = kindOf(CONFIG.works[ch]) === 'demo';
  if (playing && demo) clockT += (now - last) / 1000;
  last = now;
  if (!tv.classList.contains('embed')) drawScene(sctx, CONFIG.works[ch].scene, clockT);
  requestAnimationFrame(frame);
}

// 글자판: ← → 영상 넘기기, 스페이스 재생. 한글 입력 상태에서도 먹도록 e.code 로 본다.

  if (k === 'ArrowLeft') tune(ch - 1, false);

const wide = () => matchMedia('(min-width:761px)').matches;
let zTop = 10;
function focusWin(w){
  w.style.zIndex = ++zTop;
  document.querySelectorAll('.win').forEach(x => x.classList.toggle('active', x === w));
}
function syncDock(){ document.querySelectorAll('#dock [data-open]').forEach(b => b.classList.toggle('live', $('#w-' + b.dataset.open).classList.contains('open'))); }
function openWin(id){
  const w = $('#w-' + id), was = w.classList.contains('open');
  w.classList.add('open'); if (!was && wide() && !w.dataset.moved) place(w);
  focusWin(w); syncDock();
  if (!wide()) w.scrollIntoView({behavior: 'smooth', block: 'start'});
}
function closeWin(w){
  w.classList.remove('open', 'max');
  if (w.id === 'w-player' && kindOf(CONFIG.works[ch]) !== 'demo') setPlaying(false);  // 닫힌 창에서 소리가 계속 나지 않게
  syncDock();
  const top = [...document.querySelectorAll('.win.open')].sort((a, b) => b.style.zIndex - a.style.zIndex)[0];
  if (top) focusWin(top);
}
function place(w){
  // data-x, data-y 는 남는 공간에 대한 비율(0~1). 오른쪽 아이콘 줄(100px)과 독(96px)은 비워 둔다.
  const d = $('#desktop').getBoundingClientRect(), r = w.getBoundingClientRect();
  w.style.left = Math.max(8, (d.width - 100 - r.width) * +w.dataset.x) + 'px';
  w.style.top = Math.max(8, (d.height - r.height - 96) * +w.dataset.y) + 'px';
}
document.querySelectorAll('.win').forEach(w => {
  w.addEventListener('pointerdown', () => focusWin(w));
  w.querySelector('.c').onclick = w.querySelector('.m').onclick = e => { e.stopPropagation(); closeWin(w); };
  w.querySelector('.z').onclick = e => { e.stopPropagation(); w.classList.toggle('max'); };
  const bar = w.querySelector('.bar'); let ox, oy, drag = false;
  bar.addEventListener('dblclick', e => { if (wide() && !e.target.closest('.lights')) w.classList.toggle('max'); });
  bar.addEventListener('pointerdown', e => {
    if (!wide() || e.target.closest('.lights') || w.classList.contains('max')) return;
    drag = true; w.dataset.moved = 1; ox = e.clientX - w.offsetLeft; oy = e.clientY - w.offsetTop; bar.setPointerCapture(e.pointerId);
  });

    if (!drag) return;
    w.style.left = Math.min(innerWidth - 60, Math.max(-w.offsetWidth + 60, e.clientX - ox)) + 'px';
    w.style.top = Math.min(innerHeight - 80, Math.max(0, e.clientY - oy)) + 'px';
  });
  bar.addEventListener('pointerup', () => drag = false);
  bar.addEventListener('pointercancel', () => drag = false);
});

  if (!wide()) return;
  document.querySelectorAll('.win.open').forEach(w => { if (!w.dataset.moved) place(w); });
}

const spot = $('#spot'), spotIn = $('#spotIn'), spotList = $('#spotList');
let spotItems = [], spotSel = 0;
function spotAll(){
  return [
    ...APPS.map(([id, label, colors, d]) => ({label, hint: '메뉴', icon: appIcon(colors, d), run: () => openWin(id)})),
    ...CONFIG.works.map((w, i) => ({label: w.title, hint: w.cat || '작업물', work: [w, i], run: () => { tune(i, true); openWin('player'); }})),
    {label: '밝게·어둡게 바꾸기', hint: '동작', icon: appIcon(['#8e8e93', '#48484a'], 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2v14a7 7 0 0 1 0-14z'), run: () => $('#themeBtn').click()},
    {label: '배경 바꾸기', hint: '동작', icon: appIcon(['#64d2ff', '#5e5ce6'], 'M4 5h16v14H4zm2 12h12l-4-6-3 4-2-2.500z'), run: nextWall},
  ];
}
function spotRender(){
  const q = spotIn.value.trim().toLowerCase();
  spotItems = spotAll().filter(x => !q || (x.label + ' ' + x.hint + ' ' + (x.key || '')).toLowerCase().includes(q)).slice(0, 8);
  spotSel = Math.min(spotSel, Math.max(0, spotItems.length - 1));
  spotList.innerHTML = '';
  spotItems.forEach((x, i) => {
    const li = document.createElement('li'); li.className = i === spotSel ? 'sel' : '';
    li.innerHTML = (x.icon || '') + `<b>${x.label}</b><small>${x.hint}</small>`;
    if (x.work) li.prepend(thumbEl(...x.work));
    li.onmousemove = () => { if (spotSel !== i) { spotSel = i; [...spotList.children].forEach((c, k) => c.classList.toggle('sel', k === i)); } };
    li.onclick = () => spotRun(i);

}
function spotOpen(){ spot.classList.add('on'); spotIn.value = ''; spotSel = 0; spotRender(); spotIn.focus(); }

$('#spotBtn').onclick = spotOpen;

spotIn.addEventListener('input', () => { spotSel = 0; spotRender(); });
spotIn.addEventListener('keydown', e => {
  if (e.isComposing) return;  // 한글 조합 중 엔터는 글자 확정이다
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); spotSel = (spotSel + (e.key === 'ArrowDown' ? 1 : -1) + spotItems.length) % Math.max(1, spotItems.length); spotRender(); }

addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea,select');
  if ((e.metaKey || e.ctrlKey) && e.code === 'KeyK') { e.preventDefault(); spot.classList.contains('on') ? spotClose() : spotOpen(); }
  else if (e.code === 'Slash' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); spotOpen(); }
  else if (e.key === 'Escape') { spotClose(); ctxClose(); }
});

const WALLS = ['rokiz', 'indigo', 'dusk', 'graphite'];
function setWall(w, save){ document.documentElement.dataset.wall = w; if (save) store.set('rokiz-wall', w); }
function nextWall(){ setWall(WALLS[(WALLS.indexOf(document.documentElement.dataset.wall) + 1) % WALLS.length], true); }

// ── 바탕화면 오른쪽 누름 메뉴 ──
const ctx = $('#ctx');
const CTX = [
  ['제작 문의 쓰기', () => openWin('contact')], ['작업물 보기', () => openWin('works')], ['찾기…', () => spotOpen()], null,
  ['배경 바꾸기', () => nextWall()], ['밝게·어둡게 바꾸기', () => $('#themeBtn').click()], null,
  ['창 모두 닫기', () => document.querySelectorAll('.win.open').forEach(closeWin)],
];
ctx.innerHTML = CTX.map((x, i) => x ? `<button data-i="${i}" role="menuitem">${x[0]}</button>` : '<hr>').join('');
ctx.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { ctxClose(); CTX[b.dataset.i][1](); } };
function ctxClose(){ ctx.classList.remove('on'); }
$('#desktop').addEventListener('contextmenu', e => {
  if (!wide() || e.target.closest('.win')) return;
  e.preventDefault(); ctx.classList.add('on');
  ctx.style.left = Math.min(e.clientX, innerWidth - ctx.offsetWidth - 8) + 'px';
  ctx.style.top = Math.min(e.clientY, innerHeight - ctx.offsetHeight - 8) + 'px';
});
addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) ctxClose(); });

// ── 시계 ──
function tick(){ const d = new Date();
  $('#wcDow').textContent = d.toLocaleDateString('ko-KR', {weekday: 'long'}); $('#wcDay').textContent = d.getDate(); $('#wcTime').textContent = d.toLocaleTimeString('ko-KR', {hour: 'numeric', minute: '2-digit'});
  $('#clock').textContent = d.toLocaleDateString('ko-KR', {month: 'long', day: 'numeric', weekday: 'short'}) + '  ' + d.toLocaleTimeString('ko-KR', {hour: 'numeric', minute: '2-digit'}); }
tick(); setInterval(tick, 10000);

// ── 밝게·어둡게: 기본은 어둡게, 고르면 기억한다 ──
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
function setTheme(t, save){ document.documentElement.dataset.theme = t; if (save) store.set('rokiz-theme', t); }
setTheme(store.get('rokiz-theme') === 'light' ? 'light' : 'dark');
setWall(WALLS.includes(store.get('rokiz-wall')) ? store.get('rokiz-wall') : 'rokiz');
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);

// ── 파비콘: 검은 판에 노란 로고 ──
{ const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d');
  c.fillStyle = '#000'; c.beginPath(); c.roundRect ? c.roundRect(2, 2, 60, 60, 15) : c.rect(2, 2, 60, 60); c.fill();
  c.translate(8, 22); c.scale(48 / 548, 48 / 548); c.fillStyle = '#f7ce0a'; c.fill(new Path2D(LOGO_PATH), 'evenodd');
  const l = document.createElement('link'); l.rel = 'icon'; l.href = cv.toDataURL(); document.head.append(l); }

// ── 주소 끝 #works 처럼 붙이면 그 창을 연다 ──
function fromHash(){ const id = location.hash.slice(1); if (id && $('#w-' + id)) openWin(id); }
fromHash(); addEventListener('hashchange', fromHash);

// ── 켜지는 화면: 탭마다 한 번만, 움직임 줄이기 설정이면 건너뛴다 ──
(() => {
  let seen; try { seen = sessionStorage.getItem('rokiz-boot'); sessionStorage.setItem('rokiz-boot', 1); } catch { seen = 1; }
  if (seen || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const boot = $('#boot'); boot.classList.remove('off');
  const done = () => { boot.classList.add('bye'); setTimeout(() => boot.classList.add('off'), 400); };
  requestAnimationFrame(() => requestAnimationFrame(() => $('#pfill').style.width = '100%'));
  setTimeout(done, 1400); boot.onclick = done;
})();

// ── 알림: 탭마다 한 번, 3초 뒤에 떴다가 9초 뒤에 들어간다 ──
(() => {
  let seen; try { seen = sessionStorage.getItem('rokiz-notice'); sessionStorage.setItem('rokiz-notice', 1); } catch { seen = 1; }
  if (seen || !CONFIG.notice) return;
  const t = $('#toast'); $('#toastText').textContent = CONFIG.notice;
  const hide = () => t.classList.remove('on');
  setTimeout(() => { t.classList.add('on'); setTimeout(hide, 9000); }, 3000);
  t.onclick = e => { hide(); if (!e.target.closest('.x')) openWin('contact'); };
})();
</script>
</body>
</html>
