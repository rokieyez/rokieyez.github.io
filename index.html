<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rokiz</title>
  <meta name="description" content="문마다 다른 방이 있습니다 — 로키즈의 개인 사이트.">
  <meta name="theme-color" content="#171009">
  <!-- 밤의 집이다 — 스크롤막대·기본 위젯도 어두운 쪽을 쓰게 한다 -->
  <meta name="color-scheme" content="dark">
  <!-- rokiz.net 은 www 로 301 되지만, 어느 주소로 걸어 들어오든 한 쪽을 가리킨다 -->
  <link rel="canonical" href="https://www.rokiz.net/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/books/icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="rokiz.net">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="로키즈의 방">
  <meta property="og:description" content="문마다 다른 방이 있습니다 — 지금은 하나가 열려 있습니다.">
  <meta property="og:url" content="https://www.rokiz.net/">
  <!-- 링크를 나눌 때 보이는 얼굴 — 없으면 카톡·슬랙이 회색 상자를 띄운다 -->
  <meta property="og:image" content="https://www.rokiz.net/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="밤빛 바탕의 열쇠구멍과 「로키즈의 방」">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="로키즈의 방">
  <meta name="twitter:description" content="문마다 다른 방이 있습니다 — 지금은 하나가 열려 있습니다.">
  <meta name="twitter:image" content="https://www.rokiz.net/og.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant:ital,wght@1,500&display=swap">
  <style>
    /* rokiz.net 대문 — 방(경로)들로 들어가는 입구.
       서가 뒤의 방(/books)과 같은 밤의 세계관을 아주 옅게만 공유한다.
       루트 사이트가 본격적으로 자라기 전까지의 소박한 대문. */
    :root {
      --dark: #171009;
      --paper: #E9DFC9;
      --dim: #9C8E74;
      --brass: #E0B15E;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* 두 칸짜리 격자 — 위 칸에 대문, 아래 칸에 서명.
       예전에는 footer 를 position: fixed 로 바닥에 붙였는데, 화면이 낮으면
       (폰을 눕히면 360px 다) 「다른 방들은 아직 잠겨 있습니다」 위에 겹쳐
       앉았다. 흐름 안에 두면 좁아질수록 저절로 비켜난다. */
    body {
      margin: 0;
      background: var(--dark);
      color: var(--paper);
      font-family: "Gowun Batang", "Noto Serif KR", serif;
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      text-align: center;
    }
    main { padding: 24px; }
    .latin {
      font-family: "Cormorant", serif;
      font-style: italic;
      font-size: 15px;
      letter-spacing: .22em;
      color: var(--dim);
    }
    h1 {
      margin: 10px 0 6px;
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 700;
      letter-spacing: .06em;
    }
    .sub {
      margin: 0 0 42px;
      font-size: 14.5px;
      color: var(--dim);
      line-height: 1.7;
    }
    .doors {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }
    .door {
      display: inline-block;
      padding: 13px 30px;
      border: 1px solid rgba(224, 177, 94, .38);
      border-radius: 3px;
      color: var(--brass);
      text-decoration: none;
      font-size: 15.5px;
      letter-spacing: .04em;
      transition: background .3s, border-color .3s;
    }
    .door:hover, .door:focus-visible {
      background: rgba(224, 177, 94, .08);
      border-color: rgba(224, 177, 94, .7);
      outline: none;
    }
    .door small {
      display: block;
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--dim);
      letter-spacing: .08em;
    }
    .soon {
      font-size: 12.5px;
      color: var(--dim);
      opacity: .75;
    }
    footer {
      padding: 0 0 18px;
      font-size: 11.5px;
      color: var(--dim);
      opacity: .6;
      letter-spacing: .1em;
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise .9s ease both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
    }
  </style>
  <!-- 이 집이 누구의 것이고 어떤 방이 있는지 — 검색 결과의 얼굴을 정한다 -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"로키즈의 방",
   "alternateName":"rokiz.net","url":"https://www.rokiz.net/","inLanguage":"ko",
   "description":"문마다 다른 방이 있습니다 — 로키즈의 개인 사이트.",
   "hasPart":{"@type":"WebSite","name":"서가 뒤의 방",
     "url":"https://www.rokiz.net/books/",
     "description":"한 사람의 장서를 그대로 옮겨 담은 밤의 서재."}}
  </script>
</head>
<body>
<main>
  <p class="latin">ROKIZ</p>
  <h1>로키즈의 방</h1>
  <p class="sub">문마다 다른 방이 있습니다 — 지금은 하나가 열려 있습니다.</p>
  <div class="doors">
    <a class="door" href="/books/">서가 뒤의 방
      <!-- 권수는 적지 않는다 — 장서는 계속 늘고, 정적 파일의 숫자는 반드시 거짓이 된다 -->
      <small>한 사람의 장서를 그대로 옮겨 담은 밤의 서재</small>
    </a>
    <p class="soon">다른 방들은 아직 잠겨 있습니다</p>
  </div>
</main>
<footer>rokiz.net</footer>
</body>
</html>
