<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 — 로키즈의 방</title>
  <!-- 아직 글이 한 편도 없다. 빈 방이 검색에 뜨면 「잠긴 문」과 다를 것이 없으므로,
       첫 글을 올리고 대문에 문을 걸 때 이 줄을 지운다. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#171009">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://www.rokiz.net/notes/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant:ital,wght@1,500&display=swap">
  <style>
    :root { --dark:#171009; --paper:#E9DFC9; --dim:#9C8E74; --brass:#E0B15E; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--dark); color: var(--paper);
      font-family: "Gowun Batang", "Noto Serif KR", serif; line-height: 1.85;
      display: grid; grid-template-rows: 1fr auto; place-items: center;
    }
    main { padding: 56px 24px 32px; max-width: 62ch; width: 100%; }
    .latin { font-family: "Cormorant", serif; font-style: italic;
             font-size: 14px; letter-spacing: .22em; color: var(--dim); margin: 0; }
    h1 { margin: 8px 0 34px; font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: .05em; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { margin: 0 0 16px; }
    li a { font-size: 15.5px; color: var(--brass); text-decoration: none;
           border-bottom: 1px solid rgba(224,177,94,.3); }
    li time { display: block; font-size: 12px; color: var(--dim); opacity: .75; letter-spacing: .06em; }
    .empty { color: var(--dim); font-size: 14px; opacity: .8; }
    footer { padding: 0 24px 28px; font-size: 11.5px; color: var(--dim);
             opacity: .6; letter-spacing: .1em; text-align: center; }
    footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(156,142,116,.3); }
  </style>
</head>
<body>
<main>
  <p class="latin">SCRIPTA</p>
  <h1>글</h1>

  <!-- 글을 하나 올릴 때:
       1. _본보기.html 을 복사해 notes/<제목-슬러그>.html 로 이름을 바꾼다
       2. 그 안의 제목·날짜·본문·설명을 채운다
       3. 아래 <ul> 에 한 줄 더한다:
          <li><a href="어떤-글.html">어떤 글</a><time datetime="2026-09-03">2026년 9월 3일</time></li>
       4. 이 파일과 새 글의 <meta name="robots" content="noindex"> 를 지운다
       5. /sitemap.xml 에 두 주소를 더하고, 대문(index.html)의 .doors 에 문을 하나 연다 -->
  <ul id="list">
  </ul>
  <p class="empty" id="none">아직 첫 글을 놓지 않았습니다.</p>
</main>
<footer>rokiz.net · <a href="/">대문</a> · <a href="/now/">지금</a></footer>
<script>
  /* 글이 하나라도 생기면 「아직 없습니다」는 스스로 물러난다 */
  if (document.getElementById("list").children.length) {
    document.getElementById("none").hidden = true;
  }
</script>
</body>
</html>
