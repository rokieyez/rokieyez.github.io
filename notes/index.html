    :root { --dark:#171009; --paper:#E9DFC9; --dim:#9C8E74; --brass:#E0B15E; --bad:#C4705A; }

    main { position: relative; padding: 56px 24px 32px; max-width: 64ch; width: 100%; }

  </style>

<script>
/* ─────────────────────────────────────────────────────────────────────
   글방. 글은 서재와 같은 Supabase 프로젝트의 notes 표에 산다 —
   계정이 하나이므로 로그인도 하나면 된다 (서재에서 들어와 있으면
   여기서도 이미 들어와 있다).

   방문자에게는 supabase 라이브러리를 내려보내지 않는다. 목록과 글은
   REST 를 그냥 부르면 되고, 라이브러리가 필요한 것은 로그인뿐이다 —
   서재가 작업대(intake.js)를 주인 확인 뒤에 싣는 것과 같은 뜻이다.
   ───────────────────────────────────────────────────────────────────── */
const 집 = "https://gaeumegwhxxnfvrhbknp.supabase.co";
const 열쇠 = "sb_publishable_NI4gjQ3YePIO90H7YjHjfA_m_H0udRy";
const REST = 집 + "/rest/v1/notes";
const $ = (id) => document.getElementById(id);

/* 들어와 있으면 그 토큰으로 부른다 — 그래야 초고까지 보인다 */
let 세션 = null;
const 머리 = () => ({
  apikey: 열쇠,
  Authorization: "Bearer " + (세션?.access_token || 열쇠),
});

const 날짜 = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
};

/* 주소에 쓸 이름 — 서재의 나눔 쪽과 같은 규칙이다.
   한글은 그대로 둔다 (주소창에는 한글로 보인다). */
const 슬러그 = (제목) => String(제목 || "")
  .replace(/[‘’“”「」『』]/g, "")
  .replace(/[^0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ]+/g, "-")
  .replace(/^-+|-+$/g, "")
  .slice(0, 60)
  .replace(/-+$/, "");

/* 본문은 평문으로 간직하고 그릴 때 문단을 나눈다 — 빈 줄이 문단의 경계다.
   HTML 을 그대로 넣지 않으므로 글자에 무엇이 들었든 안전하다. */
function 문단(글, 자리) {
  자리.textContent = "";
  String(글 || "").split(/\n{2,}/).forEach((덩) => {
    const t = 덩.trim();
    if (!t) return;
    const p = document.createElement("p");
    // 한 문단 안의 한 줄 바꿈은 그대로 살린다
    t.split("\n").forEach((줄, i) => {
      if (i) p.appendChild(document.createElement("br"));
      p.appendChild(document.createTextNode(줄));
    });
    자리.appendChild(p);
  });
}

/* ── 읽기 ─────────────────────────────────────────────────────────── */
let 글들 = [];

/* 한 번에 받는 편수. 목록은 본문까지 통째로 받는데(첫 문장 미리보기에 쓴다)
   한도가 없으면 글이 쌓일수록 목록 한 번에 모든 글의 전문이 실려 온다.
   50편이면 대략 50KB — 그 뒤는 「더 보기」가 이어 받는다. */
const 한묶음 = 50;
let 받은수 = 0;

async function 싣기(이어서) {
  if (!이어서) { 받은수 = 0; 글들 = []; }
  try {
    const r = await fetch(
      `${REST}?select=slug,title,body,published,published_at,created_at,book_id` +
      `&order=published_at.desc.nullslast,created_at.desc` +
      `&limit=${한묶음}&offset=${받은수}`,
      { headers: 머리() });
    if (!r.ok) throw new Error(r.status);
    const 온것 = await r.json();
    글들 = 이어서 && Array.isArray(글들) ? [...글들, ...온것] : 온것;
    받은수 = Array.isArray(글들) ? 글들.length : 0;
    /* 묶음이 꽉 찼으면 뒤에 더 있을 수 있다 — 딱 맞아떨어져도 한 번은 더 묻는다 */
    $("more").hidden = 온것.length < 한묶음;
  } catch {
    if (!이어서) 글들 = null;   // 못 읽었다는 것과 비어 있다는 것은 다르다
    $("more").hidden = true;
  }
  그리기();
}


function 그리기() {
  const 목록 = $("list"), 없음 = $("none");
  목록.textContent = "";
  if (글들 === null) {
    없음.hidden = false;
    없음.textContent = "글을 불러오지 못했습니다. 잠시 뒤에 다시 열어 보세요.";
    return;
  }
  없음.hidden = 글들.length > 0;
  없음.textContent = "아직 첫 글을 놓지 않았습니다.";
  글들.forEach((n) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    /* 발행한 글은 제 쪽(<슬러그>.html)으로 보낸다 — 자바스크립트 없이 열리고,
       검색·미리보기가 따라 들어올 수 있는 진짜 링크다. 초고는 쪽이 없으므로
       이 쪽 안(해시)에서만 펼친다. */
    a.href = n.published
      ? encodeURIComponent(n.slug) + ".html"
      : "#" + encodeURIComponent(n.slug);
    a.textContent = n.title;
    li.appendChild(a);
    if (!n.published) {
      const b = document.createElement("span");
      b.className = "draft";
      b.textContent = "초고";
      li.appendChild(b);
    }
    /* 주인에게는 고칠 손잡이를 하나 더 준다 — 발행한 글의 링크가 정적 쪽으로
       가 버려서, 이것이 없으면 올린 글을 다시 열 길이 없다. */
    if (세션 && n.published) {
      const e = document.createElement("a");
      e.className = "edit";
      e.href = "#" + encodeURIComponent(n.slug);
      e.textContent = "고치기";
      li.appendChild(e);
    }
    const t = document.createElement("time");
    t.dateTime = (n.published_at || n.created_at || "").slice(0, 10);
    t.textContent = 날짜(n.published_at || n.created_at);
    /* 읽는 데 걸리는 시간 — 한국어는 분당 500자 어림. 아주 짧은 글에
       「1분」이 붙으면 오히려 우스우니 300자 아래는 적지 않는다. */
    const 자 = String(n.body || "").replace(/\s/g, "").length;
    if (자 >= 300) {
      const m = document.createElement("span");
      m.className = "mins";
      m.textContent = `· ${Math.max(1, Math.round(자 / 500))}분`;
      t.appendChild(m);
    }
    li.appendChild(t);
    /* 첫 문장 — 제목만 있는 목록은 어떤 글인지 알려 주지 못한다 */
    const 맛 = String(n.body || "").replace(/\s+/g, " ").trim();
    if (맛) {
      const pk = document.createElement("p");
      pk.className = "peek";
      pk.textContent = 맛.slice(0, 140);
      li.appendChild(pk);
    }
    목록.appendChild(li);
  });
  해시읽기();
}

/* 주소의 해시가 목록과 글 한 편 사이를 오간다 */
function 해시읽기() {
  const s = decodeURIComponent(location.hash.replace(/^#/, ""));
  const 글 = s && Array.isArray(글들) ? 글들.find((n) => n.slug === s) : null;
  $("listview").hidden = !!글;
  $("postview").hidden = !글;

  if (글) {

    $("p-when").textContent = 날짜(글.published_at || 글.created_at) +
      (글.published ? "" : " · 초고");
    문단(글.body, $("p-body"));
    document.title = `${글.title} — 로키즈의 방`;
    // 글마다 다른 얼굴을 검색·미리보기에 알린다 (정적 쪽은 도구가 따로 짓는다)
    document.querySelector('meta[property="og:title"]')?.setAttribute("content", 글.title);

}

/* 히스토리에 우리가 밀어 넣은 항목이 있나. 초고를 열면 목록의 링크(#슬러그)가
   한 칸을 쌓는데, 「글 목록」으로 돌아갈 때 해시만 비우면 그 칸이 그대로
   남는다 — 그러면 다음 뒤로 가기가 직전 쪽이 아니라 같은 쪽으로 간다

$("back").addEventListener("click", (e) => {

       쓰면 그것이 또 한 칸을 쌓아 같은 병을 만든다. 갈아 끼우고 손으로 그린다

    history.replaceState(null, "", location.pathname + location.search);

async function 라이브러리() {

    s.onload = ok; s.onerror = () => no(new Error("라이브러리를 받지 못했습니다"));
    document.head.appendChild(s);

/* ── 쓰기 ─────────────────────────────────────────────────────────── */

/* ── 이 글이 말하는 책 ───────────────────────────────────────────
   글방과 서재가 남남이었다 — 책을 읽고 쓴 글인데 그 책으로 가는 길이 없고,
   책 쪽에서도 그 책을 말한 글을 알 수 없었다. 여기서 한 권을 건다.
   서재의 공개 API 를 그대로 쓴다 (읽기만, 필요한 칸만). */
const 서재REST = 집 + "/rest/v1/books";
let 찾는손 = null;

async function 책찾기(말) {
  const q = 말.trim();
  if (q.length < 2) { $("w-found").hidden = true; return; }
  const r = await fetch(
    `${서재REST}?select=id,title,author,cover_url` +
    `&title=ilike.*${encodeURIComponent(q)}*&order=title.asc&limit=8`,
    { headers: { apikey: 열쇠, Authorization: "Bearer " + 열쇠 } }).catch(() => null);
  if (!r?.ok) { $("w-found").hidden = true; return; }
  const 책들 = await r.json();
  const ul = $("w-found");
  ul.textContent = "";
  if (!책들.length) { ul.hidden = true; return; }
  책들.forEach((b) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = b.title;
    const i = document.createElement("i");
    i.textContent = b.author || "지은이 미상";
    btn.appendChild(i);
    btn.addEventListener("click", () => {
      건책 = b.id;
      $("w-book").value = "";
      ul.hidden = true;
      걸린책보이기(b);
    });
    li.appendChild(btn);
    ul.appendChild(li);
  });
  ul.hidden = false;
}

/* 지금 걸려 있는 책을 한 줄로 알린다. 책 정보를 모르면 서재에 한 번 묻는다 */
async function 걸린책보이기(아는것) {
  const p = $("w-bookpick");
  p.textContent = "";
  if (!건책) { p.textContent = "아직 걸지 않았습니다 — 비워 두어도 됩니다."; return; }

  if (!b) {
    const r = await fetch(`${서재REST}?select=id,title,author&id=eq.${건책}&limit=1`,
      { headers: { apikey: 열쇠, Authorization: "Bearer " + 열쇠 } }).catch(() => null);
    b = r?.ok ? (await r.json())[0] : null;
  }
  p.append(`걸어 둔 책: ${b?.title || "(서가에서 찾지 못했습니다)"}`);
  const x = document.createElement("button");
  x.type = "button";
  x.className = "unpick";
  x.textContent = "떼기";
  x.addEventListener("click", () => { 건책 = null; 걸린책보이기(); });
  p.append(" ", x);
}

async function 저장(발행할까) {
  const title = $("w-title").value.trim();
  const slug = ($("w-slug").value.trim() || 슬러그(title));
  const body = $("w-body").value;
  if (!title) { 말("w-say", "제목이 있어야 합니다.", "bad"); return; }
  if (!slug) { 말("w-say", "주소를 만들지 못했습니다 — 손으로 적어 주세요.", "bad"); return; }

  const 지금글 = Array.isArray(글들) ? 글들.find((n) => n.slug === 고치는중) : null;
  const 발행 = 발행할까 === null ? (지금글?.published || false) : 발행할까;
  const 몸 = {
    owner_id: 세션.user.id, slug, title, body, published: 발행, book_id: 건책,
    // 처음 발행한 때는 한 번만 적는다 — 고칠 때마다 날짜가 바뀌면 안 된다
    published_at: 발행 ? (지금글?.published_at || new Date().toISOString()) : null,
  };
  말("w-say", "적는 중…");

    새것 ? REST : `${REST}?slug=eq.${encodeURIComponent(고치는중)}`,
    {
      method: 새것 ? "POST" : "PATCH",
      headers: { ...머리(), "Content-Type": "application/json", Prefer: "return=representation" },
      body: JSON.stringify(몸),

  if (!r.ok) {

    말("w-say", /duplicate key|notes_owner_slug_key/.test(t)

    return;
  }
  말("w-say", 발행 ? "발행했습니다." : "초고로 간직했습니다.", "good");
  고치는중 = slug;
  await 싣기();
  location.hash = "#" + encodeURIComponent(slug);
}

$("w-save").addEventListener("click", () => 저장(false));
$("w-publish").addEventListener("click", () => {
  const 지금글 = Array.isArray(글들) ? 글들.find((n) => n.slug === 고치는중) : null;

  if (!고치는중) return;
  if (!confirm(`「${$("w-title").value}」를 지웁니다. 되돌릴 수 없습니다.`)) return;

  await 싣기();
  말("w-say", "지웠습니다.", "good");
});

싣기();
