    :root { --dark:#171009; --paper:#E9DFC9; --dim:#9C8E74; --brass:#E0B15E; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;

    p { margin: 0 0 18px; font-size: 15.5px; word-break: keep-all; overflow-wrap: break-word; }
    blockquote {
      margin: 24px 0; padding: 2px 0 2px 18px;
      border-left: 1px solid rgba(224,177,94,.32); color: var(--dim); font-size: 15px;
    }
    img { max-width: 100%; height: auto; border-radius: 3px; }
    a { color: var(--brass); text-decoration: none; border-bottom: 1px solid rgba(224,177,94,.32); }
    a:hover, a:focus-visible { border-bottom-color: var(--brass); outline: none; }
    footer { padding: 0 24px 28px; font-size: 11.5px; color: var(--dim);
             opacity: .6; letter-spacing: .1em; text-align: center; }
    footer a { color: inherit; border-bottom-color: rgba(156,142,116,.3); }
