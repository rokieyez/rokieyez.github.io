<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잠긴 문</title>
  <meta name="theme-color" content="#171009">
  <meta name="color-scheme" content="dark">
  <!-- 없는 주소의 안내판이다 — 검색 결과에 「잠긴 문」이 뜨면 안 된다 -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant:ital,wght@1,500&display=swap">
  <style>
    /* 없는 주소로 들어온 사람에게 — 오류 대신 잠긴 문을 보여준다.
       루트에 두면 이 도메인 전체의 404 를 GitHub Pages 가 이 파일로 답한다. */
    :root {
      --dark:#171009; --paper:#E9DFC9; --dim:#9C8E74; --brass:#E0B15E;
      /* 손이 있는 자리 — 열쇠구멍 뒤의 불이 그리로 따라온다 */
      --mx: 50%; --my: 42%;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--dark); color: var(--paper);
      font-family: "Gowun Batang", "Noto Serif KR", serif;
      display: grid; place-items: center; text-align: center;
      position: relative; overflow: hidden;
    }
    /* 잠긴 문 뒤에도 불은 켜져 있다 — 열쇠구멍이 그려진 이 쪽이야말로
       빛이 새는 자리다. 손을 따라 그 빛이 움직인다. */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(38% 32% at var(--mx) var(--my),
                  rgba(224,177,94,.11), transparent 70%);
      transition: background .45s ease-out;
    }
    main { padding: 24px; position: relative; }
    .latin {
      font-family: "Cormorant", serif; font-style: italic;
      font-size: 15px; letter-spacing: .22em; color: var(--dim);
    }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 6vw, 44px); font-weight: 700; letter-spacing: .05em; }
    p { margin: 0 0 34px; font-size: 14.5px; color: var(--dim); line-height: 1.8; }
    .keyhole { width: 34px; height: 46px; margin: 0 auto 22px; opacity: .8; }
    a {
      display: inline-block; padding: 12px 28px;
      border: 1px solid rgba(224,177,94,.4); border-radius: 3px;
      color: var(--brass); text-decoration: none; font-size: 15px; letter-spacing: .04em;
      transition: background .3s, border-color .3s;
    }
    a:hover, a:focus-visible {
      background: rgba(224,177,94,.08); border-color: rgba(224,177,94,.72); outline: none;
    }
    /* 짐작한 목록 — 어느 방에서 길을 잃었는지 알 때만 나온다 */
    .guess {
      margin: 26px 0 0; padding: 20px 0 0; list-style: none;
      border-top: 1px solid rgba(224,177,94,.14); text-align: left;
      max-width: 34ch; margin-left: auto; margin-right: auto;
    }
    .guess li { margin: 0 0 9px; font-size: 13.5px; }
    .guess a {
      display: inline; padding: 0; border: 0; border-radius: 0; font-size: inherit;
      border-bottom: 1px solid rgba(224,177,94,.26);
    }
    .guess a:hover, .guess a:focus-visible { background: none; border-bottom-color: var(--brass); }
    .guess time { display: block; font-size: 11px; color: var(--dim, #9C8E74); opacity: .85; }
    /* 방으로 가는 길은 테두리 없이 — 「대문으로」가 여전히 첫 걸음이다 */
    .rooms { margin: 22px 0 0; font-size: 13px; color: var(--dim, #9C8E74); }
    .rooms a {
      display: inline; padding: 2px 0; border: 0; border-radius: 0; font-size: inherit;
      border-bottom: 1px solid rgba(224,177,94,.28);
    }
    .rooms a:hover, .rooms a:focus-visible {
      background: none; border-bottom-color: var(--brass);
    }
    /* 닿는 자리 — 보이는 크기는 그대로 */
    .rooms a { position: relative; }
    .rooms a::after { content: ""; position: absolute; left: -7px; right: -7px; top: -9px; bottom: -9px; }
  </style>
</head>
<body>
<main>
  <svg class="keyhole" viewBox="0 0 34 46" aria-hidden="true">
    <circle cx="17" cy="15" r="9" fill="none" stroke="#E0B15E" stroke-width="2"/>
    <path d="M12 22 L22 22 L19.5 42 L14.5 42 Z" fill="none" stroke="#E0B15E" stroke-width="2"/>
  </svg>
  <p class="latin">IANUA CLAUSA</p>
  <h1>잠긴 문입니다</h1>
  <p id="say">이 주소에는 아무 방도 없습니다.<br>열려 있는 문은 이쪽입니다.</p>
  <a id="first" href="/">대문으로</a>
  <p class="rooms"><a href="/books/">서가 뒤의 방</a> · <a href="/now/">지금</a> · <a href="/notes/">글</a></p>
  <!-- 글방에서 길을 잃었으면 여기 그 방의 글 목록이 온다 -->
  <ul class="guess" id="guess" hidden></ul>
</main>
<script>
  /* 어느 방에서 길을 잃었는지는 주소가 말해 준다. 「아무 방도 없습니다」로
     끝내지 않고, 그 방에 정말 있는 것들을 여기 데려온다.
     못 물어보면 조용히 아무것도 하지 않는다 — 잠긴 문은 그대로도 쓸모가 있다. */
  (function () {
    var 길 = location.pathname;
    if (길.indexOf("/notes/") !== 0) return;
    document.getElementById("say").innerHTML =
      "글방에 그런 글은 없습니다.<br>있는 글은 이것들입니다.";
    document.getElementById("first").textContent = "글방으로";
    document.getElementById("first").href = "/notes/";
    var 열쇠 = "sb_publishable_NI4gjQ3YePIO90H7YjHjfA_m_H0udRy";
    fetch("https://gaeumegwhxxnfvrhbknp.supabase.co/rest/v1/notes" +
          "?select=slug,title,published_at&order=published_at.desc&limit=8",
          { headers: { apikey: 열쇠, Authorization: "Bearer " + 열쇠 } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (글들) {
        if (!글들.length) return;
        var ul = document.getElementById("guess");
        글들.forEach(function (n) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "/notes/" + encodeURIComponent(n.slug) + ".html";
          a.textContent = n.title;
          var t = document.createElement("time");
          var d = new Date(n.published_at);
          t.textContent = d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
          li.appendChild(a); li.appendChild(t); ul.appendChild(li);
        });
        ul.hidden = false;
      })
      .catch(function () { /* 조용히 */ });
  })();

  /* 열쇠구멍 뒤의 불이 손을 따라온다 — 마우스가 있는 기계에서만.
     손가락뿐인 기계에서는 손이 늘 화면을 덮어 빛이 그 밑에 숨는다. */
  if (matchMedia("(hover: hover) and (pointer: fine)").matches &&
      !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    addEventListener("pointermove", function (e) {
      var r = document.documentElement.style;
      r.setProperty("--mx", (e.clientX / innerWidth * 100).toFixed(1) + "%");
      r.setProperty("--my", (e.clientY / innerHeight * 100).toFixed(1) + "%");
    }, { passive: true });
  }
</script>
</body>
</html>
