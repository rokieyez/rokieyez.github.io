# 배포가 끝나면 집이 한 채로 서 있는지 견준다
#
# 왜 자동으로 돌리나: 저장소 둘이 한 도메인을 나눠 쓴다. 방을 하나씩
# 고치다 보면 이쪽에만 theme-color 를 넣거나 저쪽 canonical 만 인코딩을
# 빠뜨리는 일이 생긴다 — 눈으로는 방 하나씩만 보이지만 로봇과 손님은
# 집 전체를 걸어 다닌다. 2026-09-03 에 손으로 견주다 다섯 곳을 찾았다.
#
# 실패하면 빨간불이 뜬다. 배포를 막지는 않는다 — 이미 나간 뒤에 보는
# 것이라 되돌릴 수 없고, 알아차리는 것이 이 워크플로의 일이다.
name: 집이 한 채인가

on:
  push:
    branches: [main]
  schedule:
    # 아무도 손대지 않아도 이레에 한 번은 걸어 본다 — 서재 저장소가
    # 따로 배포되므로 이쪽 push 만으로는 그 변화를 못 본다
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: check-house
  cancel-in-progress: true

jobs:
  # job 의 열쇠(id)는 영문·숫자·-·_ 만 받는다 — 보이는 이름만 우리말로
  check-house:
    name: 견준다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 「지금」이 며칠째 그대로인지 세려면 히스토리가 있어야 한다 —
          # 기본값(깊이 1)이면 커밋 하나뿐이라 어느 파일이든 오늘로 보인다
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 재는 자를 먼저 잰다
        run: node --test tools/check-house.test.mjs
      # 왜 자지 않고 묻나: 「120초 자기」는 배포가 2분을 넘기면 옛 사이트를
      # 견주고 초록불을 켰다. Pages 의 마지막 빌드가 이 커밋으로 끝났는지를
      # 15초마다 묻고, 10분 안에 안 끝나면 빨간불. 묻는 것 자체가 막히면
      # (권한·API 사정) 예전처럼 2분 자고 넘어간다 — 못 묻는다고 안 견줄 수는 없다.
      - name: 배포가 끝나기를 기다린다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            if ! json=$(gh api "repos/${{ github.repository }}/pages/builds/latest" 2>/dev/null); then
              echo "빌드 상태를 묻지 못했습니다 — 2분 자고 넘어갑니다"; sleep 120; exit 0
            fi
            st=$(jq -r .status <<<"$json"); sha=$(jq -r .commit <<<"$json")
            echo "$i: $st ${sha:0:7} (기다리는 것: ${GITHUB_SHA:0:7})"
            if [ "$st" = built ] && [ "$sha" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "10분이 지나도 이 커밋이 배포되지 않았습니다"; exit 1
      - name: 방마다의 규칙을 견준다
        run: node tools/check-house.mjs
