<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지금 — 로키즈의 방</title>
  <meta name="description" content="요즘 읽는 것과 만드는 것 — 로키즈의 지금.">
  <meta name="theme-color" content="#171009">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://www.rokiz.net/now/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://gaeumegwhxxnfvrhbknp.supabase.co" crossorigin>
  <!-- 집 전체를 구독한다 — 서재만 원하면 /books/feed.xml -->
  <link rel="alternate" type="application/atom+xml" title="로키즈의 방" href="/feed.xml">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="rokiz.net">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="지금 — 로키즈의 방">
  <meta property="og:description" content="요즘 읽는 것과 만드는 것.">
  <meta property="og:url" content="https://www.rokiz.net/now/">
  <meta property="og:image" content="https://www.rokiz.net/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.rokiz.net/og.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant:ital,wght@1,500&display=swap">
  <style>
    /* 「지금」 — nownownow 식의 한 쪽. 이력서도 블로그도 아닌,
       지금 이 사람이 무엇에 손을 대고 있는지만 적는다.
       대문과 같은 밤의 세계를 옅게 나눠 쓴다. */
    :root { --dark:#171009; --paper:#E9DFC9; --dim:#9C8E74; --brass:#E0B15E; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100%;
      background: var(--dark); color: var(--paper);
      font-family: "Gowun Batang", "Noto Serif KR", serif;
      line-height: 1.85;
      display: grid; grid-template-rows: 1fr auto; place-items: center;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(48% 34% at 50% 12%, rgba(224,177,94,.09), transparent 70%);
    }
    main { position: relative; padding: 56px 24px 32px; max-width: 62ch; width: 100%; }
    .latin {
      font-family: "Cormorant", serif; font-style: italic;
      font-size: 14px; letter-spacing: .22em; color: var(--dim); margin: 0;
    }
    h1 { margin: 8px 0 4px; font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: .05em; }
    .when { margin: 0 0 44px; font-size: 12.5px; color: var(--dim); opacity: .8; letter-spacing: .04em; }
    section { margin: 0 0 38px; }
    h2 {
      margin: 0 0 12px; font-size: 13px; font-weight: 400;
      color: var(--brass); letter-spacing: .18em; opacity: .85;
    }
    h2::after {
      content: ""; display: block; width: 100%; height: 1px;
      margin-top: 8px; background: rgba(224,177,94,.16);
    }
    p { margin: 0 0 12px; font-size: 14.5px; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { margin: 0 0 10px; font-size: 14.5px; }
    li b { font-weight: 400; }
    /* 읽는 중인 책은 표지를 곁들인다 — 글자만 있는 줄보다 「지금」이 잘 보인다.
       표지는 알라딘 CDN 것이라 서재의 전송량과는 상관이 없다.
       주소가 죽었으면 그림을 걷고 글줄만 남긴다 (onerror). */
    li.withcover { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
    li.withcover img {
      width: 58px; flex: 0 0 58px; min-width: 0;
      border-radius: 2px; background: rgba(224,177,94,.06);
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    li.withcover .t { min-width: 0; }
    /* 갈피 막대 — 「520쪽 중 1쪽」을 눈으로도. 1% 아래로는 내려가지 않는다
       (0% 는 「아직 안 펼침」과 구별이 안 된다 — 서재의 규칙과 같다) */
    .prog {
      display: block; height: 3px; max-width: 260px; margin-top: 7px;
      background: rgba(224,177,94,.13); border-radius: 2px; overflow: hidden;
    }
    .prog i { display: block; height: 100%; background: rgba(224,177,94,.6); }
    li i { font-style: normal; color: var(--dim); font-size: 12.5px; }
    a { color: var(--brass); text-decoration: none; border-bottom: 1px solid rgba(224,177,94,.32); }
    a:hover, a:focus-visible { border-bottom-color: var(--brass); outline: none; }
    .dim { color: var(--dim); }
    .empty { color: var(--dim); font-size: 13.5px; opacity: .75; }
    footer {
      padding: 0 24px 28px; font-size: 11.5px; color: var(--dim);
      opacity: .6; letter-spacing: .1em; text-align: center;
    }
    footer a { color: inherit; border-bottom-color: rgba(156,142,116,.3); }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise .8s ease both; }
      @keyframes rise { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
    }
  </style>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebPage","name":"지금 — 로키즈의 방",
   "url":"https://www.rokiz.net/now/","inLanguage":"ko",
   "description":"요즘 읽는 것과 만드는 것.",
   "isPartOf":{"@type":"WebSite","name":"로키즈의 방","url":"https://www.rokiz.net/"}}
  </script>
</head>
<body>
<main>
  <p class="latin">NUNC</p>
  <h1>지금</h1>
  <!-- 「언제 적은 것인가」가 없으면 이런 쪽은 금세 거짓말이 된다.
       읽는 중인 책은 서재가 실시간으로 알려 주므로 늘 오늘 것이다. -->
  <p class="when" id="when">읽는 중인 책은 서재에서 바로 받아 옵니다</p>

  <section>
    <h2>읽는 중</h2>
    <!-- 서재의 「읽는 중」 책을 그대로 가져온다. 손으로 옮겨 적으면
         반드시 어긋난다 — 서재에서 책을 덮는 순간 여기도 같이 덮인다. -->
    <ul id="reading"><li class="empty">서재에 물어보는 중…</li></ul>
  </section>

  <section>
    <h2>만드는 중</h2>
    <ul>
      <li><b><a href="/books/">서가 뒤의 방</a></b>
        <i>— 1,300여 권의 실물 장서를 옮겨 담는 중. 지금은 서지를 채우고 있습니다</i></li>
      <li><b>이 집</b>
        <i>— rokiz.net 의 방들을 하나씩 여는 중</i></li>
    </ul>
  </section>

  <section>
    <h2>최근에 꽂은 책</h2>
    <!-- 서재가 스스로 짓는 피드(feed.xml)를 그대로 읽는다. 같은 도메인이라
         담 너머로 부를 것도 없고, 서재가 「새로 들어온 것」을 정하는 규칙을
         여기서 되풀이하지 않아도 된다 — 규칙 사본을 늘리지 않는 편이 낫다. -->
    <ul id="shelved"><li class="empty">서재의 피드를 읽는 중…</li></ul>
  </section>

  <section>
    <h2>요즘 마음</h2>
    <!-- 여기는 주인이 손으로 적는 자리다. 아래 문장을 지우고 그대로 쓰면 된다. -->
    <p class="empty">아직 적어 두지 않았습니다.</p>
  </section>

  <!-- 지난 지금 — 이 쪽은 덮어쓰는 쪽이라 고칠 때마다 과거가 사라진다.
       크게 바뀔 때 이 파일을 now/<연도>-<달>.html 로 복사해 두면 기록이 된다.
       그때 아래 <ul> 에 한 줄 더하고 이 절의 hidden 을 지운다. -->
  <section id="past" hidden>
    <h2>지난 지금</h2>
    <ul>
    </ul>
  </section>

  <p class="dim" style="font-size:12.5px">
    이런 쪽을 <a href="https://nownownow.com/about" rel="noopener">now 쪽</a>이라고 부릅니다 —
    이력이 아니라 지금에 대한 한 장.
  </p>
</main>
<footer>rokiz.net · <a href="/">대문</a> · <a href="/books/">서재</a></footer>

<script>
/* 읽는 중인 책 — 서재에 직접 묻는다. 필요한 칸만 골라 받아서
   오가는 것이 몇백 바이트를 넘지 않는다 (books/CLAUDE.md 의 Egress 규칙).
   못 물어보면 그 사실을 말한다 — 빈 자리를 남기거나 거짓으로 채우지 않는다. */
(async function () {
  const 집 = "https://gaeumegwhxxnfvrhbknp.supabase.co/rest/v1/books";
  const 열쇠 = "sb_publishable_NI4gjQ3YePIO90H7YjHjfA_m_H0udRy";
  const 자리 = document.getElementById("reading");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  try {
    const r = await fetch(
      집 + "?select=id,title,author,bookmark_page,page_count,cover_url" +
      "&read_status=eq." + encodeURIComponent("읽는 중") + "&limit=6",
      { headers: { apikey: 열쇠, Authorization: "Bearer " + 열쇠 } });
    if (!r.ok) throw new Error(r.status);
    const 책들 = await r.json();
    if (!책들.length) {
      자리.innerHTML = '<li class="empty">지금 펼쳐 둔 책이 없습니다.</li>';
      return;
    }
    /* 알라딘은 표지가 없을 때 「No Image」 그림 주소를 돌려준다 —
       그걸 걸면 회색 안내판이 액자에 걸린다. 표지가 없는 것으로 친다 */
    const 진짜표지 = (u) => (u && !/\/noimg/i.test(u) ? u : null);
    자리.innerHTML = 책들.map((b) => {
      const 갈피 = (b.bookmark_page && b.page_count)
        ? ` — ${b.page_count}쪽 중 ${b.bookmark_page}쪽` : "";
      const 표지 = 진짜표지(b.cover_url);
      const 막대 = (b.bookmark_page && b.page_count)
        ? `<span class="prog"><i style="width:${
            Math.max(1, Math.round(b.bookmark_page / b.page_count * 100))}%"></i></span>` : "";
      const 글 = `<b><a href="/books/#book/${esc(b.id)}">${esc(b.title || "무제")}</a></b>` +
                 `<i> ${esc(b.author || "지은이 미상")}${esc(갈피)}</i>${막대}`;
      if (!표지) return `<li>${글}</li>`;
      return `<li class="withcover">` +
        `<img src="${esc(표지)}" alt="" loading="lazy" decoding="async"` +
        ` onerror="this.closest('li').classList.remove('withcover');this.remove()">` +
        `<span class="t">${글}</span></li>`;
    }).join("");
  } catch {
    자리.innerHTML = '<li class="empty">서재를 열지 못했습니다 — ' +
      '<a href="/books/">서재로 가서 직접 보세요</a>.</li>';
  }

  /* 이런 쪽은 오래되면 거짓말이 된다. 「언제 적은 것인가」를 사람이 손으로
     적으면 그것부터 낡으므로, 서재가 갈피를 옮긴 시각을 그대로 가져와
     「이틀 전」처럼 말하게 한다 — 스스로 낡는 줄이 없어진다. */
  try {
    const r = await fetch(
      집 + "?select=bookmark_at&read_status=eq." + encodeURIComponent("읽는 중") +
      "&bookmark_at=not.is.null&order=bookmark_at.desc&limit=1",
      { headers: { apikey: 열쇠, Authorization: "Bearer " + 열쇠 } });
    if (!r.ok) return;
    const [b] = await r.json();
    if (!b?.bookmark_at) return;
    const 날 = (Date.now() - new Date(b.bookmark_at)) / 86400000;
    const 말 = 날 < 1 ? "오늘" : 날 < 2 ? "어제" : 날 < 30 ? `${Math.floor(날)}일 전`
             : 날 < 365 ? `${Math.floor(날 / 30)}달 전` : `${Math.floor(날 / 365)}해 전`;
    document.getElementById("when").textContent =
      `갈피를 마지막으로 옮긴 것은 ${말}입니다 — 읽는 중인 책은 서재에서 바로 받아 옵니다`;
  } catch { /* 못 물어보면 처음 문구 그대로 둔다 */ }
})();

/* 최근에 꽂은 책 — 서재의 피드를 읽는다. 같은 도메인이라 그냥 부르면 되고,
   5KB 안팎이라 오가는 짐도 가볍다. 「입고」로 표시된 것만 골라 다섯 권. */
(async function () {
  const 자리 = document.getElementById("shelved");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  try {
    const r = await fetch("/books/feed.xml");
    if (!r.ok) throw new Error(r.status);
    const 문서 = new DOMParser().parseFromString(await r.text(), "application/xml");
    if (문서.querySelector("parsererror")) throw new Error("피드를 읽지 못했습니다");
    const 항목 = [...문서.getElementsByTagName("entry")]
      .filter((e) => e.querySelector("category")?.getAttribute("term") === "입고")
      .slice(0, 5);
    if (!항목.length) { 자리.innerHTML = '<li class="empty">아직 새로 꽂은 책이 없습니다.</li>'; return; }
    자리.innerHTML = 항목.map((e) => {
      const 제목 = (e.getElementsByTagName("title")[0]?.textContent || "무제").replace(/\s*입고$/, "");
      const 주소 = e.querySelector("link")?.getAttribute("href") || "/books/";
      const 곁 = e.getElementsByTagName("summary")[0]?.textContent || "";
      return `<li><b><a href="${esc(주소)}">${esc(제목)}</a></b><i> ${esc(곁)}</i></li>`;
    }).join("");
  } catch {
    자리.innerHTML = '<li class="empty">서재의 피드를 읽지 못했습니다 — ' +
      '<a href="/books/">서재에서 직접 보세요</a>.</li>';
  }
})();
</script>
</body>
</html>
